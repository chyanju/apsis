[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apsis-parlant"
version = "0.1.1+extended"
description = "apsis parlant front-end: read parlant journeys into the apsis IR"
requires-python = ">=3.10"
dependencies = ["parlant>=3.0"]

[tool.setuptools]
packages = ["apsis_parlant"]
