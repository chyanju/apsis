[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apsis-llamaindex"
version = "0.1.1+extended"
description = "apsis LlamaIndex front-end: read built LlamaIndex workflows into the apsis IR"
requires-python = ">=3.10"
dependencies = ["llama-index-workflows>=2.0"]

[tool.setuptools]
packages = ["apsis_llamaindex"]
