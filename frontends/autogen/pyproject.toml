[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apsis-autogen"
version = "0.1.1"
description = "apsis AutoGen front-end: extract a built AutoGen orchestration into the apsis IR"
requires-python = ">=3.9"
# No dependency on the framework: the front-end reads both the 0.2 API (pyautogen) and the 0.4 API
# (autogen-agentchat / autogen-core), which cannot be installed together. Install it next to the one
# the workflow uses.
dependencies = []

[tool.setuptools]
packages = ["apsis_autogen"]
